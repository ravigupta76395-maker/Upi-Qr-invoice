<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0d; --panel:#15181c; --panel-2:#1b1f24; --line:#2a2f36;
    --gold:#c9a24e; --emerald:#19c98a; --text:#edeff2; --muted:#8b93a0; --danger:#e05a5a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; padding:40px 20px;
    background:radial-gradient(circle at 20% -10%, rgba(201,162,78,0.08), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter',sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }
  .card{
    width:100%; max-width:420px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; padding:28px;
  }
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--emerald);text-transform:uppercase;margin-bottom:8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0 0 20px;}
  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  input{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif; outline:none;
  }
  input:focus{border-color:var(--emerald);}
  button{
    width:100%; padding:13px; border-radius:9px; border:none; margin-top:18px;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary{background:var(--emerald); color:#06251a;}
  .btn-primary:hover{background:#22e09c;}
  .btn-secondary{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn-secondary:hover{border-color:var(--gold); color:var(--gold);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  #result{margin-top:24px; display:none; text-align:center;}
  #qrImg{background:#fff; padding:10px; border-radius:12px; width:200px; height:200px; margin:0 auto 14px;}
  #qrImg img{width:100%;height:100%;display:block;}
  .order-id{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-bottom:4px;}
  .amount{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:26px; color:var(--emerald); margin-bottom:16px;}

  .status-pill{
    display:inline-block; padding:6px 14px; border-radius:20px;
    font-family:'JetBrains Mono',monospace; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase;
    margin-top:14px;
  }
  .status-pending{background:rgba(201,162,78,.15); color:var(--gold); border:1px solid rgba(201,162,78,.35);}
  .status-paid{background:rgba(25,201,138,.15); color:var(--emerald); border:1px solid rgba(25,201,138,.35);}
  .error{color:var(--danger); font-size:13px; margin-top:12px; display:none;}
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">⏤͟͞ 𝐑ᴀᴠɪ 𝐄ᴍᴘᴇʀᴏʀ</div>
    <h1>Settings</h1>

    <label>Gmail address (receives FamPay alerts)</label>
    <input id="gmailUser" type="email" placeholder="you@gmail.com">

    <label>Gmail App Password</label>
    <input id="gmailAppPassword" type="password" placeholder="16-character app password">

    <label>UPI ID</label>
    <input id="upiId" type="text" placeholder="yourid@okhdfcbank">

    <label>Payee name (shown to payer)</label>
    <input id="upiPayeeName" type="text" placeholder="Ravi Enterprises">

    <button class="btn-secondary" id="saveConfigBtn">Save settings</button>
    <div class="error" id="configErr"></div>
    <div id="configStatus" style="font-size:12px;color:var(--muted);margin-top:10px;"></div>
  </div>

  <div class="card">
    <div class="eyebrow">⏤͟͞ 𝐑ᴀᴠɪ 𝐄ᴍᴘᴇʀᴏʀ</div>
    <h1>Create UPI order</h1>

    <label>Amount (₹)</label>
    <input id="amount" type="number" min="1" step="0.01" placeholder="500">

    <label>Note (optional)</label>
    <input id="note" type="text" placeholder="Payment for order">

    <button class="btn-primary" id="createBtn">Generate QR</button>
    <div class="error" id="createErr"></div>

    <div id="result">
      <div id="qrImg"></div>
      <div class="order-id" id="orderIdText"></div>
      <div class="amount" id="amountText"></div>
      <label style="margin-top:18px;">API URL (payment check)</label>
      <div style="display:flex;gap:8px;">
        <input id="apiUrlText" type="text" readonly style="font-family:'JetBrains Mono',monospace;font-size:12px;">
        <button class="btn-secondary" id="copyUrlBtn" style="width:auto;margin-top:0;padding:0 16px;white-space:nowrap;">Copy</button>
      </div>
      <button class="btn-secondary" id="checkBtn">Check payment status</button>
      <div class="error" id="checkErr"></div>
      <div id="statusPill"></div>
    </div>
  </div>

<script>
// API base URL — agar index.html aur index.js alag jagah host ho rahe hain
// (e.g. frontend Netlify pe, backend Vercel pe), yahan apna backend ka
// full URL daal do, jaise: 'https://your-api.vercel.app'
// Same domain pe deploy kiya hai to isko khali hi rehne do.
const API_BASE = '';

let currentOrderId = null;

// ---- Settings: load existing status + save new values ----
async function loadConfigStatus() {
  try {
    const res = await fetch(API_BASE + '/config');
    const data = await res.json();
    if (data.gmailUser) document.getElementById('gmailUser').value = data.gmailUser;
    if (data.upiId) document.getElementById('upiId').value = data.upiId;
    if (data.upiPayeeName) document.getElementById('upiPayeeName').value = data.upiPayeeName;
    document.getElementById('gmailAppPassword').placeholder = data.gmailAppPasswordSet
      ? 'Already set — leave blank to keep it'
      : '16-character app password';
    document.getElementById('configStatus').textContent = data.gmailAppPasswordSet
      ? 'Gmail App Password is set.'
      : 'Gmail App Password not set yet.';
  } catch (err) {
    // silent — settings just won't prefill
  }
}
loadConfigStatus();

document.getElementById('saveConfigBtn').addEventListener('click', async () => {
  const errBox = document.getElementById('configErr');
  errBox.style.display = 'none';
  const btn = document.getElementById('saveConfigBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    const res = await fetch(API_BASE + '/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        gmailUser: document.getElementById('gmailUser').value,
        gmailAppPassword: document.getElementById('gmailAppPassword').value || undefined,
        upiId: document.getElementById('upiId').value,
        upiPayeeName: document.getElementById('upiPayeeName').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to save');

    document.getElementById('gmailAppPassword').value = '';
    document.getElementById('configStatus').textContent = 'Saved ✓';
    loadConfigStatus();
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save settings';
  }
});

document.getElementById('createBtn').addEventListener('click', async () => {
  const amount = document.getElementById('amount').value;
  const note = document.getElementById('note').value;
  const errBox = document.getElementById('createErr');
  errBox.style.display = 'none';

  if (!amount || Number(amount) <= 0) {
    errBox.textContent = 'Enter a valid amount.';
    errBox.style.display = 'block';
    return;
  }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = 'Generating…';

  try {
    const res = await fetch(API_BASE + '/create-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: Number(amount), note }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to create order');

    currentOrderId = data.orderId;
    document.getElementById('qrImg').innerHTML = `<img src="${data.qrDataUrl}" alt="UPI QR">`;
    document.getElementById('orderIdText').textContent = 'Order ' + data.orderId;
    document.getElementById('amountText').textContent = '₹' + Number(data.amount).toLocaleString('en-IN', {minimumFractionDigits:2});
    const checkUrl = (API_BASE || window.location.origin) + '/check-payment/' + data.orderId;
    document.getElementById('apiUrlText').value = checkUrl;
    document.getElementById('statusPill').innerHTML = '<span class="status-pill status-pending">Pending</span>';
    document.getElementById('result').style.display = 'block';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate QR';
  }
});

document.getElementById('copyUrlBtn').addEventListener('click', () => {
  const input = document.getElementById('apiUrlText');
  input.select();
  navigator.clipboard.writeText(input.value).then(() => {
    const btn = document.getElementById('copyUrlBtn');
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});

document.getElementById('checkBtn').addEventListener('click', async () => {
  if (!currentOrderId) return;
  const btn = document.getElementById('checkBtn');
  const errBox = document.getElementById('checkErr');
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Checking Gmail…';

  try {
    const res = await fetch(API_BASE + '/check-payment/' + currentOrderId);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to check status');

    if (data.status === 'paid') {
      document.getElementById('statusPill').innerHTML = '<span class="status-pill status-paid">Paid ✓</span>';
    } else {
      document.getElementById('statusPill').innerHTML = '<span class="status-pill status-pending">Still pending</span>';
    }
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check payment status';
  }
});
</script>
</body>
</html>
